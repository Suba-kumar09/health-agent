[agent]
device_id = ""
server_url = "https://ingest.example.com"
sync_interval_secs = 5400          # 90 min
capture_mode = "aggregate"          # "aggregate" | "detailed"
bucket_seconds = 30
browser_bridge_port = 0             # 0 = pick a random free port at first run

[sync]
max_batches_per_tick = 5
batch_max_events = 500
batch_max_bytes = 1048576           # 1 MB
gzip = true
backoff_initial_secs = 5
backoff_max_secs = 900

[retention]
mode = "delete_after_sync"          # "delete_after_sync" | "keep_days"
grace_secs = 3600
keep_days = 30

[collectors]
input_watcher = true
window_watcher = true
afk = true
browser_bridge = true

[privacy]
encrypt_at_rest = true
afk_threshold_secs = 120

# Buddy, the robot voice assistant. Speaks the server's reminders aloud (Windows
# built-in voice, offline) with a small animated robot. Silent unless the server runs.
[voice]
enabled = true
robot = true                        # show the animated robot while speaking
greet_on_start = true               # say hello once the server first answers
rate = 1                            # speed, -10 (slow) .. 10 (fast)
pitch = 6                           # -10 .. 10; higher sounds more like a robot
volume = 90                         # 0 .. 100
voice_name = ""                     # part of an installed voice's name, e.g. "Zira"; "" = default
