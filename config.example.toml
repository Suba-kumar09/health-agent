[agent]
device_id = ""
server_url = "https://ingest.example.com"
sync_interval_secs = 5400          # 90 min
capture_mode = "aggregate"          # "aggregate" | "detailed"
bucket_seconds = 30
browser_bridge_port = 0             # 0 = pick a random free port at first run

[sync]
max_batches_per_tick = 5
batch_max_events = 500
batch_max_bytes = 1048576           # 1 MB
gzip = true
backoff_initial_secs = 5
backoff_max_secs = 900

[retention]
# mode selects exactly one purge strategy -- the other key below is ignored
# (the agent logs which one at startup):
#   "delete_after_sync": purge a row `grace_secs` after it's confirmed synced
#   "keep_days": purge any row older than `keep_days`, regardless of sync state
mode = "delete_after_sync"          # "delete_after_sync" | "keep_days"
grace_secs = 3600
keep_days = 30

[collectors]
input_watcher = true
window_watcher = true
afk = true
browser_bridge = true

[privacy]
encrypt_at_rest = true
afk_threshold_secs = 120
json_log_enabled = true             # also mirror every event to events.jsonl, unencrypted -- see .gitignore

[reports]
enabled = true                      # keep telemetry.html/events_export.json refreshed while the agent runs
html_path = "telemetry.html"
json_path = "events_export.json"
interval_secs = 15
window_days = 7                     # live view only covers the last N days; use scripts/*.py --since/--until for full history
