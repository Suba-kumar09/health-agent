[agent]
device_id = ""
server_url = "https://ingest.example.com"
sync_interval_secs = 5400          # 90 min
capture_mode = "aggregate"          # "aggregate" | "detailed"
bucket_seconds = 30
browser_bridge_port = 0             # 0 = pick a random free port at first run

[sync]
max_batches_per_tick = 5
batch_max_events = 500
batch_max_bytes = 1048576           # 1 MB
gzip = true
backoff_initial_secs = 5
backoff_max_secs = 900

[retention]
mode = "delete_after_sync"          # "delete_after_sync" | "keep_days"
grace_secs = 3600
keep_days = 30

[collectors]
input_watcher = true
window_watcher = true
afk = true
browser_bridge = true

[privacy]
encrypt_at_rest = true
afk_threshold_secs = 120
