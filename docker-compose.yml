services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: health_agent
      POSTGRES_USER: health_agent
      POSTGRES_PASSWORD: health_agent
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://health_agent:health_agent@db:5432/health_agent
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
