<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Health Agent - Pairing</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 2rem auto; }
    label { display: block; margin-top: 0.75rem; font-size: 0.9rem; }
    input[type="number"], input[type="text"], textarea { width: 100%; padding: 0.4rem; font-size: 1rem; box-sizing: border-box; }
    textarea { resize: vertical; min-height: 3.5rem; font-family: inherit; }
    .checkbox-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.6rem; }
    .checkbox-row label { margin: 0; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; }
    #unpair-btn { background: none; border: 1px solid #999; }
    #status, #pairing-status { margin-top: 1rem; font-size: 0.9rem; }
    hr { margin: 1.5rem 0; border: none; border-top: 1px solid #ccc; }
    h3 { margin-bottom: 0.25rem; }
    .hint { font-size: 0.8rem; color: #666; margin-top: 0.15rem; }
  </style>
</head>
<body>
  <h2>Pair with your health-agent</h2>
  <div id="pairing-status">Checking pairing status...</div>

  <p>
    Start the agent on this machine, then enter the port and one-time pairing
    code it printed to its log (or tray notification).
  </p>
  <label>Agent port</label>
  <input id="port" type="number" placeholder="e.g. 53821" />
  <label>Pairing code</label>
  <input id="code" type="text" placeholder="6-digit code" maxlength="6" />
  <button id="pair-btn">Pair</button>
  <button id="unpair-btn">Unpair</button>
  <div id="status"></div>

  <hr />

  <h3>Privacy</h3>
  <div class="checkbox-row">
    <input id="enabled" type="checkbox" />
    <label for="enabled">Send tab activity to the agent</label>
  </div>
  <div class="checkbox-row">
    <input id="strip-query-strings" type="checkbox" />
    <label for="strip-query-strings">Strip query strings from URLs before sending</label>
  </div>
  <div class="checkbox-row">
    <input id="skip-incognito" type="checkbox" />
    <label for="skip-incognito">Never send incognito/private tabs</label>
  </div>
  <label>Domain denylist (comma-separated, e.g. bank.example, health.example)</label>
  <textarea id="denylist" placeholder="bank.example, health.example"></textarea>
  <div class="hint">Matches the domain and any subdomain (e.g. "bank.example" also blocks "login.bank.example").</div>
  <button id="save-privacy-btn">Save privacy settings</button>
  <div id="privacy-status"></div>

  <script src="options.js"></script>
</body>
</html>
