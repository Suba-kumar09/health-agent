[project]
name = "health-agent"
version = "0.1.0"
description = "Cross-platform health-monitoring end-device agent"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "cryptography>=42.0",
    "keyring>=25.0",
    "pynput>=1.7; sys_platform != 'linux' or extra != 'no-x11'",
    "psutil>=5.9",
    "pystray>=0.19",
    "Pillow>=10.0",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]
macos = ["pyobjc-framework-Cocoa>=10.0", "pyobjc-framework-Quartz>=10.0"]
linux = ["python-xlib>=0.33"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "freezegun>=1.4",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Contains a large embedded HTML/CSS/JS template string, not Python line-length rules.
"agent/reports.py" = ["E501"]
